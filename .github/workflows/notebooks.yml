name: Verificar notebooks

# Re-ejecuta solucion.ipynb y profundiza_solucion.ipynb de ramas/ y falla si algún
# chequeo da ❌ o algún notebook se cae — detecta módulos rotos
# (dependencias que rotan, APIs que cambian). El patrón "en vivo o caché" de los
# notebooks permite correr sin red ni API keys. Corre semanalmente y a demanda;
# correrlo antes de iniciar cada cohorte.

on:
  push:
    branches: [main]
    paths: ["ramas/**", "data/**", "tools/**", "requirements.txt"]
  pull_request:
  schedule:
    - cron: "0 9 * * 1"   # lunes 09:00 UTC (~05:00 Chile)
  workflow_dispatch:

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rama: [R1, R2, R3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install gradio

      - name: Ejecutar notebooks de ${{ matrix.rama }}
        run: python tools/run_notebooks.py --rama ${{ matrix.rama }} --timeout 600
